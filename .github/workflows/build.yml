name: Build profile

on:
  schedule:
    - cron: "0 0 * * *"        # daily, 06:00 in Bangladesh
  workflow_dispatch:
  push:
    branches: [main]
    paths: [profile.yml, scripts/**, templates/**]

permissions:
  contents: write

concurrency:
  group: build-profile
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml pillow

      - name: Build README and cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: a token that can read your repos' traffic, for view counts.
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: python scripts/build.py --refresh

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets data 2>/dev/null || git add README.md assets
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: refresh profile cards"
          git push

# ── Left sidebar (GitHub's own column, set in Settings → Public profile) ──
# The README can't draw there. These values are shown in the local preview,
# and if you add a PROFILE_TOKEN secret the daily Action writes bio, status,
# company, location and website to your account. Without the token nothing
# is changed. The bio is limited to 160 characters and fills in live values:
#   {cf_rating} {cf_rank} {cf_solved} {contributions} {streak} {repos}
#   {stars} {latest_repo} {now_building}
sidebar:
  bio: "CSE @ University of Chittagong · real-time & geo systems · Codeforces {cf_rating} · {contributions} contributions this year · latest: {latest_repo}"
  status: { emoji: "🔨", text: "Building {now_building}" }
  company: University of Chittagong
  location: Chattogram, Bangladesh
  website: ""                        # falls back to links.website
  timezone: "+06:00"                 # shown as local time in the preview
  socials:                           # add these yourself (max 4) in Settings
    - https://codeforces.com/profile/arafatsheikh098

# Ignored when computing "top languages".
languages_ignore: [Dockerfile, Makefile, Shell, Mako, Procfile, Batchfile, PowerShell, Jinja]

theme:
  dark:  { accent: "#34d399", accent2: "#fb3b5a" }   # Bangladesh green & red
  light: { accent: "#047857", accent2: "#e11d48" }


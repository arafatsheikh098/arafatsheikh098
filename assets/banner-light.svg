<style>.f{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}@media (prefers-reduced-motion: reduce){*{animation:none!important}.tag{opacity:0!important}.tag0{opacity:1!important}}.tag{opacity:0;animation:rot 14.4s ease-in-out infinite}.tag0{opacity:1}@keyframes rot{0%{opacity:0;transform:translateY(12px)}2.50%{opacity:1;transform:translateY(0)}21.50%{opacity:1;transform:translateY(0)}24.50%{opacity:0;transform:translateY(-12px)}100%{opacity:0;transform:translateY(-12px)}}.tag0{animation-delay:0.00s}.tag1{animation-delay:3.60s}.tag2{animation-delay:7.20s}.tag3{animation-delay:10.80s}.sun{transform-origin:812px 128px;animation:pulse 7s ease-in-out infinite}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}.halo{transform-origin:812px 128px;animation:halo 7s ease-in-out infinite}@keyframes halo{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.9;transform:scale(1.12)}}.w1{animation:flow 14s linear infinite}.w2{animation:flow 22s linear infinite}.w3{animation:flow 9s linear infinite}@keyframes flow{to{transform:translateX(-400px)}}.sweep{stroke-dasharray:520;animation:draw 1.8s cubic-bezier(.2,.8,.2,1) .4s backwards}@keyframes draw{from{stroke-dashoffset:520}to{stroke-dashoffset:0}}.cur{animation:blink 1.1s step-end infinite}@keyframes blink{50%{opacity:0}}.in{animation:in .9s ease-out backwards}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.d1{animation-delay:.15s}.d2{animation-delay:.35s}.d3{animation-delay:.9s}.tw{animation:tw 3s ease-in-out infinite}@keyframes tw{50%{opacity:.15}}</style>
